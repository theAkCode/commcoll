<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat UI</title>
  <link rel="stylesheet" href="2.css" />
</head>
<body>
  <nav class="navbar">
        <div class="navbar-left">
            <a href="index.html" class="logo"><img src="images/logo1.png"></a>
        </div>
        <div class="navbar-center">
            <ul>
                <li><a href="#"><img src="images/home.png">Home</a></li>
                <li><a href="#"><img src="images/message.png">Post</a></li>
                <li><a href="#"><img src="images/jobs.png">Workroom</a></li>
                <li><a href="#"><img src="images/network.png">Profile</a></li>
            </ul>
        </div>
  </nav>
  <div class="container">
    <div class="chat-window">
      <div class="chat-header">
        <div class="user-info">
          <img src="./images/clap.png" alt="User" />
          <div>
            <p class="name">Group 1</p>
            <p class="status">Online</p>
          </div>
        </div>
        <!-- <button class="new-message">+ New Message</button> -->
      </div>

      <div class="messages">
        <div class="message received">Hi </div>
        <div class="message sent">hello </div>
        <!-- <div class="message received">Great, I’ll send over the brief later today.</div> -->
      </div>

      <div class="chat-input">
        <input type="text" placeholder="Write your message..." />
        <button>➤</button>
      </div>
    </div>
  </div>
</body>
</html>
